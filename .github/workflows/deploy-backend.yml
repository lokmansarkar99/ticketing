name: Deploy Backend (EC2)

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

concurrency:
  group: backend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (CI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install deps (CI)
        working-directory: backend
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Build (CI)
        working-directory: backend
        run: npm run build --if-present

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }} # ssh-agent action [web:175]

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} << 'EOF'
            set -euo pipefail

            # Load nvm for non-interactive shell
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 22

            # Ensure pm2 exists for this node version (nvm isolates globals)
            command -v pm2 >/dev/null 2>&1 || npm i -g pm2

            cd /home/ubuntu/projects/with-cicd/ticketing

            # Update code
            git fetch --all
            git reset --hard origin/main

            cd backend

            export PUPPETEER_SKIP_DOWNLOAD=true

            # Deterministic install (no lockfile drift) [web:134]
            npm ci

            # Build TS -> dist/index.js
            npm run build --if-present

            # Prisma production migrations
            npx prisma migrate deploy
            npx prisma generate

            # Apply ecosystem config + update env (best practice) [web:115]
            pm2 start ecosystem.config.js --only prantik-cicd --update-env
            pm2 save
          EOF
