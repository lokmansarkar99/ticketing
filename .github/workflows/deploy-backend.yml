name: Deploy Backend (SSM)

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

concurrency:
  group: backend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (CI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install deps (CI)
        working-directory: backend
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          npm_config_ignore_scripts: "true"
        run: npm ci

      - name: Prisma generate (CI)
        working-directory: backend
        env:
          DATABASE_URL: "mysql://user:pass@localhost:3306/db"
        run: npx prisma generate

      - name: Build (CI)
        working-directory: backend
        run: |
          npm run build --if-present
          npm run copy:assets --if-present

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "${{ secrets.AWS_ACCESS_KEY_ID }}" || (echo "Missing AWS_ACCESS_KEY_ID" && exit 1)
          test -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" || (echo "Missing AWS_SECRET_ACCESS_KEY" && exit 1)
          test -n "${{ secrets.AWS_REGION }}" || (echo "Missing AWS_REGION" && exit 1)
          test -n "${{ secrets.EC2_INSTANCE_ID }}" || (echo "Missing EC2_INSTANCE_ID" && exit 1)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Send SSM command (deploy)
        id: send
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy backend" \
            --parameters '{
              "commands": [
                "bash -lc '\''set -euo pipefail; cd /home/ubuntu/projects/with-cicd/ticketing && git fetch --all && git reset --hard origin/main && cd backend && export NVM_DIR=\"$HOME/.nvm\" && [ -s \"$NVM_DIR/nvm.sh\" ] && . \"$NVM_DIR/nvm.sh\" && nvm use 22 && command -v pm2 >/dev/null 2>&1 || npm i -g pm2 && export PUPPETEER_SKIP_DOWNLOAD=true && unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE && export DATABASE_URL=$(aws ssm get-parameter --name \"/ticketing/prod/DATABASE_URL\" --with-decryption --query \"Parameter.Value\" --output text) && test -n \"$DATABASE_URL\" && npm ci && npm run build --if-present && npx prisma migrate deploy && npx prisma generate && pm2 restart prantik-cicd --update-env || pm2 start ecosystem.config.js --only prantik-cicd --env production --update-env && pm2 save'\''"
              ]
            }' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM CommandId: $COMMAND_ID"

      - name: Wait + fetch remote output
        shell: bash
        run: |
          CMD="${{ steps.send.outputs.command_id }}"
          IID="${{ secrets.EC2_INSTANCE_ID }}"

          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" --query "Status" --output text 2>/dev/null || true)
            echo "Status: $STATUS"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              break
            fi
            sleep 6
          done

          aws ssm get-command-invocation \
            --command-id "$CMD" \
            --instance-id "$IID" \
            --query "{Status:Status,ResponseCode:ResponseCode,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
            --output json

          FINAL_STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" --query "Status" --output text)
          if [ "$FINAL_STATUS" != "Success" ]; then
            echo "Remote deploy failed with status: $FINAL_STATUS"
            exit 1
          fi
