name: Deploy Backend (SSM)

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

concurrency:
  group: backend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (CI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install deps (CI)
        working-directory: backend
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          npm_config_ignore_scripts: "true"
        run: npm ci

      - name: Prisma generate (CI)
        working-directory: backend
        env:
          DATABASE_URL: "mysql://user:pass@localhost:3306/db"
        run: npx prisma generate

      - name: Build (CI)
        working-directory: backend
        run: |
          npm run build --if-present
          npm run copy:assets --if-present

      - name: Validate SSM secrets
        run: |
          test -n "${{ secrets.AWS_ACCESS_KEY_ID }}" || (echo "Missing AWS_ACCESS_KEY_ID" && exit 1)
          test -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" || (echo "Missing AWS_SECRET_ACCESS_KEY" && exit 1)
          test -n "${{ secrets.AWS_REGION }}" || (echo "Missing AWS_REGION" && exit 1)
          test -n "${{ secrets.EC2_INSTANCE_ID }}" || (echo "Missing EC2_INSTANCE_ID" && exit 1)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy on EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy backend" \
            --parameters 'commands=[
              "set -euo pipefail",

              "cd /home/ubuntu/projects/with-cicd/ticketing",
              "git fetch --all",
              "git reset --hard origin/main",
              "cd backend",

              "export NVM_DIR=\"$HOME/.nvm\"",
              "[ -s \"$NVM_DIR/nvm.sh\" ] && . \"$NVM_DIR/nvm.sh\"",
              "nvm use 22",

              "command -v pm2 >/dev/null 2>&1 || npm i -g pm2",
              "export PUPPETEER_SKIP_DOWNLOAD=true",

              "unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE",

              \"export DATABASE_URL=$(aws ssm get-parameter --name '/ticketing/prod/DATABASE_URL' --with-decryption --query 'Parameter.Value' --output text)\",
              "test -n \"$DATABASE_URL\"",

              "npm ci",
              "npm run build --if-present",

              "npx prisma migrate deploy",
              "npx prisma generate",

              "pm2 restart prantik-cicd --update-env || pm2 start ecosystem.config.js --only prantik-cicd --env production --update-env",
              "pm2 save"
            ]' \
            --output text
