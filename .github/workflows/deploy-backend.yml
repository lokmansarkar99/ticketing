name: Deploy Backend (EC2)

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

concurrency:
  group: backend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (CI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      # Install deps WITHOUT lifecycle scripts (prevents postinstall prisma generate in CI)
      - name: Install deps (CI)
        working-directory: backend
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          npm_config_ignore_scripts: "true"
        run: npm ci

      # Generate prisma client with dummy DB URL (types needed for tsc)
      - name: Prisma generate (CI)
        working-directory: backend
        env:
          DATABASE_URL: "mysql://user:pass@localhost:3306/db"
        run: npx prisma generate

      # Build + copy swagger.yaml into dist
      - name: Build (CI)
        working-directory: backend
        run: |
          npm run build --if-present
          npm run copy:assets --if-present

      # Fail early if secrets missing (no secret values printed)
      - name: Validate SSH secrets
        run: |
          test -n "${{ secrets.EC2_HOST }}" || (echo "Missing EC2_HOST secret" && exit 1)
          test -n "${{ secrets.EC2_USERNAME }}" || (echo "Missing EC2_USERNAME secret" && exit 1)
          test -n "${{ secrets.EC2_SSH_KEY }}" || (echo "Missing EC2_SSH_KEY secret" && exit 1)

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=120 \
              ${EC2_USER}@${EC2_HOST} << 'EOF'
            set -euo pipefail

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 22

            command -v pm2 >/dev/null 2>&1 || npm i -g pm2

            cd /home/ubuntu/projects/with-cicd/ticketing

            git fetch --all
            git reset --hard origin/main

            cd backend
            export PUPPETEER_SKIP_DOWNLOAD=true

            npm ci
            npm run build --if-present

            npx prisma migrate deploy
            npx prisma generate

            pm2 start ecosystem.config.js --only prantik-cicd --update-env
            pm2 save
          EOF
